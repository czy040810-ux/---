name: Shiti demo keep-awake

on:
  schedule:
    # Every 10 minutes (UTC). GitHub Actions scheduling can be delayed.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check demo window
        id: window
        shell: bash
        run: |
          # Stop making requests after 2026-11-13 23:59 Asia/Shanghai.
          if [ "$(date -u +%s)" -ge "$(date -u -d '2026-11-13 16:00:00 UTC' +%s)" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Demo window ended; no further requests."
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Visit Shiti homepage
        if: steps.window.outputs.active == 'true'
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --connect-timeout 15 --max-time 100 \
            --retry 1 --retry-delay 5 \
            --output /dev/null \
            --write-out 'Shiti status: HTTP %{http_code}, time: %{time_total}s\\n' \
            'https://shiti-review.onrender.com/'
